<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/beantrip_icon_highcontrast.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <meta name="description" content="Beantrip helps you discover the world's best specialty coffee shops. Browse reviews, filter by roast type and brewing method, and find your perfect cup." />
    <title>Beantrip — Find Specialty Coffee Spots</title>
    <script>
      // www and the bare domain are different origins for things like notification
      // permissions and localStorage, which confuses users who land on both -- always
      // send visitors to the bare domain.
      if (window.location.hostname === 'www.beantrip.com') {
        window.location.replace('https://beantrip.com' + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
